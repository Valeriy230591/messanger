[build]
  command = "npm run build"
  publish = "dist"
  functions = ""  # Явно укажите пустую строку, если не используете функции

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ДОБАВЬТЕ ЭТО:
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
